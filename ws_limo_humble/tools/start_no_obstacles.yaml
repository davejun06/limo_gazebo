# Start settings for the world WITHOUT obstacles (src/limo_ros2/limo_car/worlds/roboracer/ifac_roboracer.world).
# Same track and map as the obstacle world (only the 3 boxes are missing), so the same start pose is used:
# whole body behind the black-and-white line, heading along the route.
#
# Change the start here:   amcl -> initial_pose (x, y, yaw)
# and use the same values when spawning Gazebo:
#   ros2 launch limo_car roboracer_sim.launch.py spawn_x:=-0.0222 spawn_y:=0.2205 spawn_yaw:=-0.1375
# Window 2 (localization) with this file:
#   ros2 launch nav2_bringup localization_launch.py map:=$PWD/src/Raceline-Optimization/maps/track_map3.yaml use_sim_time:=true params_file:=$PWD/tools/start_no_obstacles.yaml
# Note: tools/exp/go.py also puts the car on (-0.0222, 0.2205, -0.1375) via tools/exp/place_start.py;
# if you change the pose here, change X, Y, YAW in place_start.py too.
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: -0.0222
      y: 0.2205
      z: 0.0
      yaw: -0.1375
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
