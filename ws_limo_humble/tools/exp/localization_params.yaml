# AMCL + map server for the LIMO in Gazebo. Values differing from nav2_bringup defaults
# are commented with the reason; see EXPERIMENT_CHANGELOG.md (exp-005).
amcl:
  ros__parameters:
    use_sim_time: true
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 0.5    # default 1.0: post-dates map->odom less
    # odometry noise: with defaults 0.2 covariance reached 0.26-0.34 m^2 (grows at each update's prediction)
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    # laser model: the map is 0.05 m/cell; defaults (sigma 0.2, z_rand 0.5) barely constrain it
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0        # sensor limit (default 100)
    laser_min_range: 0.2        # sensor limit (default -1)
    max_beams: 120              # default 60; the scan has 720 samples
    sigma_hit: 0.1              # default 0.2
    z_hit: 0.9                  # default 0.5
    z_rand: 0.1                 # default 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    # update on small motion: at 1 m/s the default 0.25 m means only 4 corrections per second
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5
    set_initial_pose: false     # the fixed start pose is sent on /initialpose per run

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
